Documentation/Admonition:
  Enabled: false

Lint/ComparisonToBoolean:
  Enabled: true

Lint/DuplicateBranch:
  Enabled: true

Style/ArrayLiteralSyntax:
  Enabled: true

Style/GuardClause:
  Enabled: true

Style/HashLiteralSyntax:
  Enabled: true

Style/LargeNumbers:
  Enabled: true

Style/ParenthesesAroundCondition:
  AllowSafeAssignment: true

Style/VerboseNilType:
  OnlyTwoElementUnions: true

Typing/MethodParameterTypeRestriction:
  Enabled: true
  DefaultValue: true
  BlockParameters: true
  PrivateMethods: true
  ProtectedMethods: true
  NodocMethods: true

Typing/MethodReturnTypeRestriction:
  Enabled: true
  PrivateMethods: true
  ProtectedMethods: true
  NodocMethods: true

Typing/ProcLiteralReturnTypeRestriction:
  Enabled: true

Typing/MacroCallArgumentTypeRestriction:
  Enabled: true

Metrics/CyclomaticComplexity:
  Enabled: false

Layout/LineLength:
  Enabled: true
  MaxLength: 100

Globs:
  - "**/*.cr"
  - "!lib"
  - "!shims"
  - "!tools/shims_check/probes.cr"
